[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "anvaya"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "cryptography",
  "jsonschema",
  "sqlglot",
  "httpx",
  "duckdb",
  "pyarrow",
  "tzdata",
  "regex",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yaml", "*.json", "VERSION"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731"]
