server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/stream {
    proxy_pass http://api:8000/api/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
  }
  location / {
    try_files $uri /index.html;
  }
}
